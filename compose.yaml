services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-perfumeria_db}
    ports:
      - "${DB_EXTERNAL_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/create_schemas.sql:/docker-entrypoint-initdb.d/01-create-schemas.sql:ro
      - ./sql/create_tables.sql:/docker-entrypoint-initdb.d/02-create-tables.sql:ro
      - ./sql/seed_data.sql:/docker-entrypoint-initdb.d/03-seed-data.sql:ro
      - ./sql/elt/00_create_schemas.sql:/docker-entrypoint-initdb.d/04-elt-schemas.sql:ro
      - ./sql/elt/01_create_staging.sql:/docker-entrypoint-initdb.d/05-elt-staging.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-perfumeria_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  elt:
    build: .
    environment:
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-perfumeria_db}
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "main.py"]

volumes:
  postgres_data:

